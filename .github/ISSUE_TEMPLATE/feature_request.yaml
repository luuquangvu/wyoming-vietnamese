name: Feature Request
description: Suggest an idea for this project.
labels: ["enhancement"]
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > **Thank you for suggesting a new feature.**
        > We value your input and ideas on how to improve Wyoming Vietnamese.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing [issues](https://github.com/luuquangvu/wyoming-vietnamese/issues?q=is%3Aissue) to ensure this hasn't been reported or requested before.
          required: true
        - label: I have updated to the latest Docker image or Home Assistant add-on version.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this feature request relate to?
      options:
        - Speech-to-text (STT)
        - Text-to-speech (TTS)
        - Deployment / Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem_summary
    attributes:
      label: Problem Summary
      description: Describe the problem you're trying to solve.
      placeholder: "Ex. I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: "A clear and concise description of what you want to happen..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context about the feature request here.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Mockups
      description: Optional. Add screenshots or mockups to help explain your idea.
