repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Run Ruff Check
        entry: uv run --locked --no-build ruff check --fix
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: Run Ruff Format
        entry: uv run --locked --no-build ruff format
        language: system
        pass_filenames: false
        always_run: true

      - id: ty-check
        name: Run Ty Check
        entry: uv run --locked --no-build ty check
        language: system
        pass_filenames: false
        always_run: true

      - id: pyright
        name: Run Pyright
        entry: uv run --locked --no-build pyright
        language: system
        pass_filenames: false
        always_run: true

      - id: interrogate
        name: Run Interrogate
        entry: uv run --locked --no-build interrogate
        language: system
        pass_filenames: false
        always_run: true

      - id: tally
        name: Run Tally
        entry: uv run --locked --no-build tally lint --fix Dockerfile
        language: system
        pass_filenames: false
        always_run: true

      - id: prettier
        name: Run Prettier
        entry: npx --no-install prettier --write .
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Run Pytest
        entry: uv run --locked --no-build pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
