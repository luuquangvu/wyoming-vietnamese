services:
  wyoming-vietnamese:
    container_name: wyoming-vietnamese
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "10300:10300" # Shared STT/TTS Wyoming port
    environment:
      WYOMING_PORT: 10300
      TTS_VOICE: "ngoc-huyen-moi, duy-onyx-moi, thanh-phuong-viettel, ngoc-ngan, mai-phuong" # Comma and/or whitespace separated; first is default
      LOG_LEVEL: "info" # debug, info, warning, error, critical
    volumes:
      - cache:/app/.cache
      - models:/app/models

volumes:
  cache:
  models:
